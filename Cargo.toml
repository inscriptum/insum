[workspace]
resolver = "2"
members = [
    "crates/insum-core",
    "crates/insum-cli",
    "crates/insum-test-utils",
]

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/inscriptum/insum"
rust-version = "1.89"

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["unbounded_depth"] }
zip = "9.2"
sha2 = "0.10"
regex = "1"
walkdir = "2"
assert_cmd = "2"
tempfile = "3"

# insum — CLI for reading and writing Inscriptum knowledge bases (.um / .note).

[profile.release]
lto = true
