name: CI

on:
  push:
    branches: [master, "task/**", "iteration/**"]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (pinned)
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@54e2af0a8339c0435fa1de94002eab349a2f15ef # v2.7.3
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Build
        run: cargo build --all-targets
      - name: Test
        run: cargo test --workspace --all-features

  corpus-generate:
    # §4.8: the corpus is regenerated from the artifact and must be
    # byte-identical to the committed one; the Rust gate (corpus_gate)
    # replays it in the build-and-test matrix on every OS.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24.10.0
      - name: Regenerate the differential corpus
        run: cd schema-tests/generator && npm ci && npm run generate
      - name: Require a byte-identical corpus
        run: git diff --exit-code -- schema-tests/fixtures/corpus.jsonl
